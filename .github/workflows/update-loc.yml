name: Update LOC count

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # daily at 6am UTC, optional
  workflow_dispatch:      # lets you trigger it manually too

jobs:
  update-loc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch LOC count
        id: loc
        run: |
          COUNT=$(curl -s "https://ghloc.dev/api/max-su/nix/badge?branch=main" | jq -r '.message')
          # add comma formatting, e.g. 2315 -> 2,315
          FORMATTED=$(printf "%'d" "$COUNT")
          echo "count=$FORMATTED" >> "$GITHUB_OUTPUT"

      - name: Update README
        run: |
          sed -i -E "s/<!--LOC-->.*<!--\/LOC-->/<!--LOC-->${{ steps.loc.outputs.count }}<!--\/LOC-->/" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "chore: update LOC count" && git push)
